# ──────────────────────────────────────────────
# nRF52840DK 実機テスト用 Kconfig overlay
#
# Twister が nrf52840dk/nrf52840 でビルドする際に自動的に読み込まれる。
# native_sim ではこのファイルは使用されない。
#
# [SYNC] マーカーが付いた設定は、プロジェクト直下の prj.conf の
# [SYNC] セクションと同期させること。
# 同期チェック: scripts/check-conf-sync.sh
# ──────────────────────────────────────────────

# --- [SYNC] prj.conf のロジック関連設定と同期 ---
CONFIG_GPIO=y
CONFIG_DK_LIBRARY=y
CONFIG_DK_LIBRARY_BUTTON_SCAN_INTERVAL=15
CONFIG_LOG=y
CONFIG_MCUMGR=y
