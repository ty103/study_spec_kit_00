# ──────────────────────────────────────────────
# [SYNC] ロジック関連設定
# テスト対象コードの動作に影響する設定。
# 変更時は tests/unit/boards/nrf52840dk_nrf52840.conf にも
# 同じ値を反映すること（scripts/check-conf-sync.sh で検証可能）。
# ──────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_DK_LIBRARY=y
CONFIG_DK_LIBRARY_BUTTON_SCAN_INTERVAL=15
CONFIG_LOG=y
CONFIG_MCUMGR=y

# ──────────────────────────────────────────────
# [NO-SYNC] ハードウェア / ビルドインフラ設定
# 実チップ固有の設定。テストビルド（native_sim / 実機とも）には
# 同期しないこと。MCUboot パーティション変更や UART 競合など、
# テスト FW の起動・結果取得を壊す設定を含む。
# ──────────────────────────────────────────────
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.0.1+0"
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_BASE64=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_CONSOLE=y

# ──────────────────────────────────────────────
# [NO-SYNC] メモリチューニング
# スタックサイズ等の調整。テストではデフォルト値で十分。
# テスト FW に入れても害はないが、同期管理のコストに見合わない。
# ──────────────────────────────────────────────
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MAIN_STACK_SIZE=2176
